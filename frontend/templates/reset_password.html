<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:site_name" content="AgriCare — Crop Disease Prediction">
    <meta property="og:title" content="Set New Password — Crop Disease Prediction">
    <meta property="og:description" content="Choose a new password for your AgriCare account.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Set New Password — Crop Disease Prediction">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f7d47'/%3E%3Cpath d='M15 24a8 8 0 0 1-1.4-16C20 6.9 21.7 6.3 24 3.5c1.1 2.3 2.3 4.8 2.3 9.2C26.3 19 20.9 24 15 24Z' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' transform='scale(0.62) translate(6 5)'/%3E%3Cpath d='M4 27c0-3.4 2.1-6.1 5.8-6.9C12.5 19.5 15.4 17.8 16.5 16.6' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linecap='round' transform='scale(0.62) translate(6 5)'/%3E%3C/svg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">

    <!-- Decorative animated background -->
    <div class="auth-bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="leaf-float leaf-1">🍃</div>
        <div class="leaf-float leaf-2">🌿</div>
        <div class="leaf-float leaf-3">🍂</div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand -->
            <a href="/" class="auth-brand">
                <span class="brand-icon">🌿</span>
                <span class="brand-text">Agri<span class="brand-highlight">Care</span></span>
            </a>

            <h4 class="auth-title">Reset Password</h4>
            <p class="auth-subtitle">Enter your new password below.</p>

            <form id="resetForm" class="auth-form" autocomplete="off">
                <input type="hidden" id="resetToken" value="{{ token }}">
                <div class="form-group">
                    <label for="resetPassword">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="resetPassword" name="password" class="form-control" placeholder="At least 6 characters with a number" required>
                        <button type="button" class="btn-show-password" aria-label="Show password">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                    <div class="password-hint">Must be at least 6 characters and include a number.</div>
                </div>
                <div class="form-group">
                    <label for="resetConfirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="resetConfirmPassword" name="confirm_password" class="form-control" placeholder="••••••" required>
                        <button type="button" class="btn-show-password" aria-label="Show password">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-auth-submit">Reset Password</button>
            </form>

            <!-- Error / success box -->
            <div id="authError" class="auth-error" hidden></div>
            <div id="authSuccess" class="auth-success" hidden></div>

            <!-- Back to auth -->
            <a href="/auth" class="auth-back">
                <i class="bi bi-arrow-left"></i> Back to sign in
            </a>
        </div>
    </div>

    <!-- Auth logic -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
